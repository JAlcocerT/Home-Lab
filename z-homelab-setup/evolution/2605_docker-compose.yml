volumes:
  termix-data:
    driver: local
  #speedtestconfig:

networks:
  nextcloud_internal:
    internal: true # DB has no internet access; nextcloud-app reaches out via cloudflared_tunnel
  nextcloud_int:
    internal: true # DB has no internet access; nextcloud-app-sync reaches out via cloudflared_tunnel
  cloudflared_tunnel:
    external: true
