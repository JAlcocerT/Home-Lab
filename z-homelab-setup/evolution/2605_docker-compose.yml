#
# NOTE: icc=false in daemon.json only affects the legacy docker0 bridge.
# Compose creates its own per-project network where all services below can
# still reach each other by default. Add explicit per-service networks and
# set `default: false` on the compose network to enforce true isolation.
services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix #https://github.com/JAlcocerT/Docker/blob/main/SelfH/Termix/docker-compose.yml
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - termix-data:/app/data
    environment:
      # Generate: openssl rand -base64 24 | tr -d '=+/' | cut -c1-32
      SALT: "${TERMIX_SALT:?TERMIX_SALT must be set in .env}"
      PORT: "8080"

  ### NEXTCLOUD
  nextclouddb:
    image: linuxserver/mariadb:11.4.8 #mariadb:lts-noble
    restart: always
    container_name: nextclouddb
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/data1tb/nextcloud/db:/config #- db:/var/lib/mysql
    environment:
      - MYSQL_INITDB_SKIP_TZINFO=1
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD_SYNC:-rootpassword-sync}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD_SYNC:-password-sync}
      - MYSQL_DATABASE=${MYSQL_DATABASE_SYNC:-nextcloud_sync}
      - MYSQL_USER=${MYSQL_USER_SYNC:-nextcloud_sync}
    networks:
      - nextcloud_internal

  nextcloud-app:
    image: nextcloud:32.0
    container_name: nextcloud #https://hub.docker.com/_/nextcloud/tags
    security_opt:
      - no-new-privileges:true
    ports:
      - 8099:80
    user: "1000:1000" # Force Nextcloud to run as YOU, skipping the chown
    depends_on:
      - nextclouddb
    volumes:
      - /mnt/data1tb/nextcloud/html:/var/www/html
    restart: always
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_HOST=${MYSQL_HOST:-nextclouddb}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-http://192.168.1.2:8099} #by default its just localhost:8099
      #- NEXTCLOUD_TRUSTED_DOMAINS=0:cloud.example.com 1:nextcloud.lan 2:192.168.1.10
    networks:
      - nextcloud_internal
      - cloudflared_tunnel


### NEXTCLOUD SYNC
  nextclouddb-sync:
    image: mariadb:lts-noble #mariadb:11.4.8 #mariadb:lts-noble
    restart: always
    container_name: nextclouddb-sync
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/data2tb/nextcloud/db:/config #- db:/var/lib/mysql
    environment:
      - MYSQL_INITDB_SKIP_TZINFO=1
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD_SYNC:-rootpassword-sync}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD_SYNC:-password-sync}
      - MYSQL_DATABASE=${MYSQL_DATABASE_SYNC:-nextcloud_sync}
      - MYSQL_USER=${MYSQL_USER_SYNC:-nextcloud_sync}
    networks:
      - nextcloud_int

  nextcloud-app-sync:
    image: nextcloud:33.0
    container_name: nextcloud-sync #https://hub.docker.com/_/nextcloud/tags
    security_opt:
      - no-new-privileges:true
    ports:
      - 8069:80
    user: "1000:1000" # Force Nextcloud to run as YOU, skipping the chown
    depends_on:
      - nextclouddb-sync
    volumes:
      - /mnt/data2tb/nextcloud/html:/var/www/html
    restart: always
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD_SYNC:-password-sync}
      - MYSQL_DATABASE=${MYSQL_DATABASE_SYNC:-nextcloud_sync}
      - MYSQL_USER=${MYSQL_USER_SYNC:-nextcloud_sync}
      - MYSQL_HOST=${MYSQL_HOST_SYNC:-nextclouddb-sync}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS_SYNC:-http://192.168.1.2:8069} #default its just localhost
    networks:
      - nextcloud_int
      - cloudflared_tunnel


  jellyfin:
    image: lscr.io/linuxserver/jellyfin
    container_name: jellyfin ##sudo docker compose -f 2601_docker-compose.yml up -d jellyfin
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    ports:
      - "8096:8096"
    volumes:
      - "/home/Docker/Jellyfin:/config"
      #- "/media/pi/Nowy:/data/tvshows"
      - "/home/jalcocert/Desktop/YoutubeVideos:/data/tvshows"
      - "/home/jalcocert/Desktop/P2P:/data/movies"
      - "/home/jalcocert/Desktop/YoutubeMusic:/data/music"
    devices:
      - /dev/dri:/dev/dri # Hardware Acceleration for AMD 5600G
    restart: unless-stopped

  metube:
    image: ghcr.io/alexta69/metube #ytdownloader
    container_name: metube
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /home/jalcocert/Desktop/YoutubeMusic:/downloads

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    security_opt:
      - no-new-privileges:true
    user: "1000:1000" # You can adjust this to your user's UID and GID for permissions
    ports:
      - "4533:4533"
    environment:
      # Optional: set timezone to your local one. Example: "Europe/Warsaw"
      - TZ=Europe/Warsaw
      - ND_SCANINTERVAL=1h # Scan for new music every hour
    volumes:
      # This is the directory where Navidrome will store its database and settings
      - /home/jalcocert/Home-Lab/navidrome/data:/data
      # This is the directory where your music files are located
      - /home/jalcocert/Desktop/YoutubeMusic:/music:ro
    restart: unless-stopped

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent #https://github.com/linuxserver/docker-qbittorrent/packages
    container_name: qbittorrent ##sudo docker compose -f 2601_docker-compose.yml up -d qbittorrent
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=6011
    volumes:
      - /home/Docker/qbittorrent/config:/config
      - /home/jalcocert/Desktop/P2P:/downloads
    #network_mode: "service:your_gluetun_service_name" #change gluetun to your VPN service name
    ports: #you wont need the ports in this configuration file, you will need to include them in the Gluetun container
      - 6081:6881
      - 6081:6881/udp
      - 6011:6011
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/Docker/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  homepage-lite:
    image: ghcr.io/jkerdreux-imt/homepage-lite:v0.4.3 #https://github.com/jkerdreux-imt/homepage-lite/pkgs/container/homepage-lite
    container_name: homepage-lite
    security_opt:
      - no-new-privileges:true
    ports:
      - "8880:8888"
    volumes:
      - ./config/:/app/config/ #https://github.com/jkerdreux-imt/homepage-lite?tab=readme-ov-file#configuration
    restart: unless-stopped

  ### PIGALLERY
