name: ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./config/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    expose:
      - "80"
    networks:
      - default
      - cloudflared_tunnel
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"[[:space:]]*:[[:space:]]*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  ntfy_cache:
  ntfy_data:

networks:
  cloudflared_tunnel:
    external: true
