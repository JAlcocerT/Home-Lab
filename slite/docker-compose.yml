services:
  slite:
    image: ghcr.io/miantiao-me/slite:v0.3.1
    container_name: slite
    restart: unless-stopped
    init: true
    ports:
      - "${SLITE_PORT:-5483}:5483"
    environment:
      NUXT_SITE_TOKEN: ${NUXT_SITE_TOKEN:?Set NUXT_SITE_TOKEN in .env}
      NUXT_DATA_DIR: /data
      NUXT_TRUST_PROXY: ${NUXT_TRUST_PROXY:-false}
      NUXT_CLIENT_IP_HEADER: ${NUXT_CLIENT_IP_HEADER:-}
      NUXT_GEOIP_PATH: ${NUXT_GEOIP_PATH:-}
      NUXT_PUBLIC_HOME_URL: ${NUXT_PUBLIC_HOME_URL:-}
      NUXT_NOT_FOUND_REDIRECT: ${NUXT_NOT_FOUND_REDIRECT:-}
      NUXT_REDIRECT_STATUS_CODE: ${NUXT_REDIRECT_STATUS_CODE:-301}
      NUXT_REDIRECT_WITH_QUERY: ${NUXT_REDIRECT_WITH_QUERY:-false}
      NUXT_REDIRECT_NO_STORE: ${NUXT_REDIRECT_NO_STORE:-false}
      NUXT_CASE_SENSITIVE: ${NUXT_CASE_SENSITIVE:-false}
      NUXT_DISABLE_BOT_ACCESS_LOG: ${NUXT_DISABLE_BOT_ACCESS_LOG:-false}
      NUXT_DISABLE_AUTO_BACKUP: ${NUXT_DISABLE_AUTO_BACKUP:-false}
      NUXT_SAFE_BROWSING_DOH: ${NUXT_SAFE_BROWSING_DOH:-}
      NUXT_WEBHOOK_URL: ${NUXT_WEBHOOK_URL:-}
      NUXT_WEBHOOK_SECRET: ${NUXT_WEBHOOK_SECRET:-}
      NUXT_PUBLIC_LINK_PROXY_ENABLED: ${NUXT_PUBLIC_LINK_PROXY_ENABLED:-false}
      NUXT_AI_BASE_URL: ${NUXT_AI_BASE_URL:-}
      NUXT_AI_MODEL: ${NUXT_AI_MODEL:-}
      NUXT_AI_API_KEY: ${NUXT_AI_API_KEY:-}
    volumes:
      - slite-data:/data
    stop_grace_period: 30s

volumes:
  slite-data:
