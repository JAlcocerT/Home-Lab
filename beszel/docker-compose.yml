services:
  beszel:
    image: docker.io/henrygd/beszel:${BESZEL_VERSION:-0.21.0}
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL:-http://192.168.1.2:3813}
    ports:
      - ${BESZEL_BIND:-0.0.0.0}:${BESZEL_PORT:-3813}:8090
    volumes:
      - ./beszel_data:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 10s
      timeout: 5s
      retries: 3
    networks:
      - beszel

networks:
  beszel:
    ipam:
      config:
        - subnet: ${BESZEL_SUBNET:-10.89.13.0/24}
