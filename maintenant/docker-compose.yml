services:
  maintenant:
    image: ${MAINTENANT_IMAGE:-ghcr.io/kolapsis/maintenant:latest}
    container_name: maintenant
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    ports:
      - "${MAINTENANT_BIND:-0.0.0.0}:${MAINTENANT_PORT:-3810}:8080"
    environment:
      MAINTENANT_ADDR: "0.0.0.0:8080"
      MAINTENANT_DB: "/data/maintenant.db"
      MAINTENANT_BASE_URL: "${MAINTENANT_BASE_URL:-http://192.168.1.2:3810}"
      MAINTENANT_STATUS_URL: "${MAINTENANT_STATUS_URL:-}"
      MAINTENANT_ORGANISATION_NAME: "${MAINTENANT_ORGANISATION_NAME:-Home Lab}"
      MAINTENANT_DISABLE_TELEMETRY: "${MAINTENANT_DISABLE_TELEMETRY:-true}"
      MAINTENANT_CONTAINER_DOWN_AFTER: "${MAINTENANT_CONTAINER_DOWN_AFTER:-5m}"
      MAINTENANT_PROXY_LABELS: "${MAINTENANT_PROXY_LABELS:-false}"
      MAINTENANT_MCP: "${MAINTENANT_MCP:-false}"
      MAINTENANT_MCP_CLIENT_ID: "${MAINTENANT_MCP_CLIENT_ID:-}"
      MAINTENANT_MCP_CLIENT_SECRET: "${MAINTENANT_MCP_CLIENT_SECRET:-}"
      MAINTENANT_MCP_ALLOWED_REDIRECT_URIS: "${MAINTENANT_MCP_ALLOWED_REDIRECT_URIS:-}"
      MAINTENANT_LICENSE_KEY: "${MAINTENANT_LICENSE_KEY:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc/os-release:/host/etc/os-release:ro
      - maintenant-data:/data
    healthcheck:
      test: ["CMD", "/app/maintenant", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  maintenant-data:
