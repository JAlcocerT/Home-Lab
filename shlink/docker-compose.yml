services:
  shlink:
    image: shlinkio/shlink:stable
    restart: unless-stopped
    environment:
      DEFAULT_DOMAIN: "${DEFAULT_DOMAIN:-localhost:8987}"
      IS_HTTPS_ENABLED: "${IS_HTTPS_ENABLED:-false}"
      SKIP_INITIAL_GEOLITE_DOWNLOAD: "${SKIP_INITIAL_GEOLITE_DOWNLOAD:-true}"
      GEOLITE_LICENSE_KEY: "${GEOLITE_LICENSE_KEY:-}"
      INITIAL_API_KEY: "${SHLINK_INITIAL_API_KEY:-}"
      DB_DRIVER: maria
      DB_USER: shlink
      DB_NAME: shlink
      DB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}"
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${SHLINK_PORT:-8987}:8080"

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: shlink
      MARIADB_USER: shlink
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}"
    volumes:
      - shlink_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  shlink-web-client:
    image: shlinkio/shlink-web-client:stable
    restart: unless-stopped
    depends_on:
      - shlink
    ports:
      - "${SHLINK_WEB_PORT:-8988}:8080"

volumes:
  shlink_mariadb_data:
