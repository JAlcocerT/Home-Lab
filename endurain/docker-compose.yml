services:
  endurain:
    image: ghcr.io/endurain-project/endurain@sha256:e099e13c79e8d8122402d219a176928d9a71c0f2665bdfc22cbe83c7f2196f55
    container_name: homelab-endurain
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - endurain_data:/app/backend/data
      - endurain_logs:/app/backend/logs
    ports:
      - "3850:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: homelab-endurain-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-endurain}
      POSTGRES_USER: ${POSTGRES_USER:-endurain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-endurain} -d $${POSTGRES_DB:-endurain}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      # PostgreSQL 18 expects the parent mount so its versioned data directory
      # remains compatible with pg_upgrade across major-version updates.
      - endurain_postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  endurain_data:
    name: homelab_endurain_data
  endurain_logs:
    name: homelab_endurain_logs
  endurain_postgres:
    name: homelab_endurain_postgres
