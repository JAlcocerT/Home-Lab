name: wanderer

x-common-env: &common-env
  MEILI_URL: http://search:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}

services:
  search:
    image: getmeili/meilisearch:v1.36.0
    container_name: wanderer-search
    restart: unless-stopped
    environment:
      <<: *common-env
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/data.ms:/meili_data/data.ms
    networks:
      - wanderer
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  db:
    image: flomp/wanderer-db:${WANDERER_VERSION:-v0.21.0}
    container_name: wanderer-db
    restart: unless-stopped
    depends_on:
      search:
        condition: service_healthy
    environment:
      <<: *common-env
      ORIGIN: ${ORIGIN:-http://192.168.1.2:3815}
      POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY:?Set POCKETBASE_ENCRYPTION_KEY in .env}
      POCKETBASE_PROXY_SECRET: ${POCKETBASE_PROXY_SECRET:?Set POCKETBASE_PROXY_SECRET in .env}
    volumes:
      - ./data/pb_data:/pb_data
      - ./data/plugins:/data/plugins
    networks:
      - wanderer
    healthcheck:
      test: ["CMD", "/curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  web:
    image: flomp/wanderer-web:${WANDERER_VERSION:-v0.21.0}
    container_name: wanderer-web
    restart: unless-stopped
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      <<: *common-env
      ORIGIN: ${ORIGIN:-http://192.168.1.2:3815}
      BODY_SIZE_LIMIT: Infinity
      POCKETBASE_PROXY_SECRET: ${POCKETBASE_PROXY_SECRET:?Set POCKETBASE_PROXY_SECRET in .env}
      PUBLIC_POCKETBASE_URL: http://db:8090
      PUBLIC_DISABLE_SIGNUP: ${PUBLIC_DISABLE_SIGNUP:-false}
      UPLOAD_FOLDER: /app/uploads
      OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de}
      VALHALLA_URL: ${VALHALLA_URL:-https://valhalla1.openstreetmap.de}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      PUBLIC_MAP_MAX_POLYLINES: ${PUBLIC_MAP_MAX_POLYLINES:-100}
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "3815:3000"
    networks:
      - wanderer
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

networks:
  wanderer:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.15.0/24
