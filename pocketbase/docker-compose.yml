services:
    pocketbase:
        build:
            context: .
            args:
                PB_VERSION: "${PB_VERSION:-0.40.4}"
        container_name: pocketbase
        restart: unless-stopped
        ports:
            - "${POCKETBASE_PORT:-8080}:8080"
        volumes:
            - pocketbase-data:/pb/pb_data
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

volumes:
    pocketbase-data:
