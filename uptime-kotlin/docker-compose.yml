services:
  uptime-kotlin:
    image: ${UPTIME_KOTLIN_IMAGE:-ghcr.io/theomeunier/uptime-kotlin:1.3.0}
    container_name: uptime-kotlin
    restart: unless-stopped
    mem_limit: ${UPTIME_KOTLIN_MEM_LIMIT:-512m}
    ports:
      - "${UPTIME_KOTLIN_BIND:-0.0.0.0}:${UPTIME_KOTLIN_PORT:-3812}:8080"
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-uptime-kotlin}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-uptime-kotlin}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in .env}
      ENCRYPTION_PREVIOUS_MASTER_KEYS: ${ENCRYPTION_PREVIOUS_MASTER_KEYS:-}
      MP_JWT_VERIFY_ISSUER: ${MP_JWT_VERIFY_ISSUER:-http://192.168.1.2:3812}
      SCHEDULER_STRATEGY: ${SCHEDULER_STRATEGY:-database}
      SCHEDULER_WORKER_CONCURRENCY: ${SCHEDULER_WORKER_CONCURRENCY:-4}
      MAINTENANCE_HORIZON_DAYS: ${MAINTENANCE_HORIZON_DAYS:-90}
      MAINTENANCE_MAX_DURATION_HOURS: ${MAINTENANCE_MAX_DURATION_HOURS:-24}
      NOTIFICATIONS_DISPLAY_TIMEZONE: ${NOTIFICATIONS_DISPLAY_TIMEZONE:-Europe/Warsaw}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uptime-kotlin

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.4-alpine}
    container_name: uptime-kotlin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uptime-kotlin}
      POSTGRES_USER: ${POSTGRES_USER:-uptime-kotlin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - uptime-kotlin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptime-kotlin} -d ${POSTGRES_DB:-uptime-kotlin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uptime-kotlin

volumes:
  uptime-kotlin-postgres:

networks:
  uptime-kotlin:
    driver: bridge
    ipam:
      config:
        - subnet: ${UPTIME_KOTLIN_SUBNET:-10.89.12.0/24}
