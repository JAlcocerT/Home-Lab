services:
  pigallery2:
    image: bpatrik/pigallery2:3.5.2
    container_name: pigallery2
    environment:
      NODE_ENV: production
      Server-publicUrl: ${PIGALLERY2_PUBLIC_URL:-}
      Server-trustProxy: ${PIGALLERY2_TRUST_PROXY:-false}
    volumes:
      - pigallery2-config:/app/data/config
      - pigallery2-db:/app/data/db
      - ${PIGALLERY2_IMAGES:?Set PIGALLERY2_IMAGES to the absolute photo-library path}:/app/data/images:ro
      - pigallery2-tmp:/app/data/tmp
    ports:
      - 127.0.0.1:${PIGALLERY2_PORT:-8088}:80
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1/heartbeat',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pigallery2-config:
  pigallery2-db:
  pigallery2-tmp:
