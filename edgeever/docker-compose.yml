services:
  edgeever:
    image: ghcr.io/tianma-if/edgeever:${EDGE_EVER_VERSION:-v1.100.0}
    container_name: edgeever
    init: true
    restart: unless-stopped
    ports:
      - "${EDGE_EVER_PORT:-8787}:8787"
    environment:
      EDGE_EVER_AUTH_USERNAME: "${EDGE_EVER_AUTH_USERNAME:-admin}"
      EDGE_EVER_AUTH_PASSWORD: "${EDGE_EVER_AUTH_PASSWORD:?Set EDGE_EVER_AUTH_PASSWORD in .env}"
      EDGE_EVER_SESSION_TTL_DAYS: "${EDGE_EVER_SESSION_TTL_DAYS:-400}"
      EDGE_EVER_CONTAINER_IMAGE: "ghcr.io/tianma-if/edgeever"
    volumes:
      - edgeever-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  edgeever-data:
