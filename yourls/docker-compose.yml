services:
  yourls:
    image: yourls:1.10.6-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${YOURLS_PORT:-8789}:8080"
    environment:
      YOURLS_SITE: "${YOURLS_SITE:-http://localhost:8789}"
      YOURLS_USER: "${YOURLS_USER:?Set YOURLS_USER in .env}"
      YOURLS_PASS: "${YOURLS_PASS:?Set YOURLS_PASS in .env}"
      YOURLS_DB_HOST: database
      YOURLS_DB_NAME: yourls
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}"
    volumes:
      - yourls-data:/var/www/html

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: yourls
      MARIADB_USER: yourls
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}"
    volumes:
      - yourls-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  yourls-data:
  yourls-db-data:
