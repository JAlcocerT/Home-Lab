services:
  slash:
    image: yourselfhosted/slash@sha256:ce3cc51f39f0a55fc7d493e0968949bf3b2d78fe7f5b0f8376f38f4390aaca5d
    container_name: slash
    restart: unless-stopped
    ports:
      - "${SLASH_PORT:-5231}:5231"
    environment:
      SLASH_MODE: prod
      SLASH_PORT: 5231
      TZ: ${TZ:-UTC}
    volumes:
      - slash_data:/var/opt/slash
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5231/healthz | grep -q 'Service ready'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  slash_data:
