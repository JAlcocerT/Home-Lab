services:
  kutt:
    image: kutt/kutt:latest
    restart: unless-stopped
    ports:
      - "${KUTT_PORT:-8788}:3000"
    environment:
      NODE_ENV: production
      SITE_NAME: "${SITE_NAME:-Kutt}"
      DEFAULT_DOMAIN: "${DEFAULT_DOMAIN:-localhost:8788}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kutt
      DB_USER: kutt
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISALLOW_REGISTRATION: "${DISALLOW_REGISTRATION:-true}"
      DISALLOW_ANONYMOUS_LINKS: "${DISALLOW_ANONYMOUS_LINKS:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_SECURE: "${MAIL_SECURE:-false}"
      MAIL_USER: "${MAIL_USER:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    volumes:
      - kutt_custom:/kutt/custom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kutt
      POSTGRES_USER: kutt
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - kutt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutt -d kutt"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kutt_redis_data:/data

volumes:
  kutt_postgres_data:
  kutt_redis_data:
  kutt_custom:
